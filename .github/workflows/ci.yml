name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp run typecheck
      - run: vp pack
      - run: vp run docs:build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the peer dependency range: the oldest and newest supported graphql-js majors
        graphql: ["16.6.0", "16", "17"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp install -D graphql@${{ matrix.graphql }}
      - run: vp test run
