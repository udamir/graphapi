graphapi: "1.0"
queryTypeName: Query
mutationTypeName: Mutation
queries:
  todo:
    description: A Query with 1 required argument and 1 optional argument
    args:
      id:
        type: ID
        nonNull: true
      isCompleted:
        description: A default value of false
        type: Boolean
        default: false
    $ref: '#/components/objects/Todo'
  todos:
    description: Returns a list (or null) that can contain null values
    directives:
      - $ref: '#/components/directives/limit'
    args:
      ids:
        description: Required argument that is a list that cannot contain null values
        type: list
        items:
          type: String
          nonNull: true
        nonNull: true
    type: list
    items:
      $ref: '#/components/objects/Todo'
mutations:
  create_todo:
    description: A Mutation with 1 required argument
    args:
      todo:
        $ref: '#/components/inputObjects/TodoInputType'
        nonNull: true
    $ref: '#/components/objects/Todo'
    nonNull: true
components:
  objects:
    Todo:
      title: Todo
      type: object
      methods:
        id:
          type: ID
          nonNull: true
        name:
          type: String
          nonNull: true
        completed:
          type: Boolean
        color:
          $ref: '#/components/enums/Color'
        colors:
          description: A field that requires an argument
          args:
            filter:
              type: list
              items:
                $ref: '#/components/enums/Color'
                nonNull: true
              nonNull: true
          type: list
          items:
            $ref: '#/components/enums/Color'
            nonNull: true
          nonNull: true
  enums:
    Color:
      title: Color
      type: enum
      values:
        RED:
          description: Red color
        GREEN:
          description: Green color
  inputObjects:
    TodoInputType:
      title: TodoInputType
      type: input
      properties:
        name:
          type: String
          nonNull: true
        completed:
          deprecation:
            reason: not used
          directives:
            - $ref: '#/components/directives/deprecated'
              meta:
                reason: not used
          type: Boolean
        color:
          $ref: '#/components/enums/Color'
          default: RED
  directives:
    limit:
      title: limit
      locations:
        - FIELD
        - FIELD_DEFINITION
      args:
        offset:
          type: Int
          default: 0
        limit:
          type: Int
          default: 20
      repeatable: false
    # the definition of the built-in @deprecated (listed because it is used) depends on the graphql-js version
    deprecated:
      title: deprecated
      repeatable: false
